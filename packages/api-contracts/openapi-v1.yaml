openapi: 3.1.0
info:
  title: Unbored API
  version: "1.0.0"
  summary: The versioned HTTP API behind the Unbored web app.
  description: |
    Every endpoint lives under `/api/v1`. The gateway owns `/api/v1` and routes
    each group to the service that implements it
    (`services/internal/apiroutes/routes.go`).

    ## Authorization tiers
    * **public** — no credentials.
    * **optional** — works anonymously, personalises when a valid token is sent.
    * **authenticated** — a verified Supabase access token is required. The
      caller's user id always comes from that token; it is never a parameter.
    * **moderator** / **admin** — **admin** is an authenticated caller whose
      verified token email is in the server-side `ADMIN_EMAILS` allowlist (the
      single source of truth for administrator access; token role claims and
      database rows never grant it). **moderator** is that, or an authenticated
      caller whose own `public.user_roles` row says moderator — staff reads and
      moderation writes, never suspension.

    ## Errors
    Failures always use the same envelope:

    ```json
    { "error": { "code": "forbidden", "message": "...", "request_id": "..." } }
    ```

    Codes: `bad_request`, `unauthorized`, `forbidden`, `not_found`, `conflict`,
    `unprocessable_entity`, `rate_limited`, `payload_too_large`,
    `unsupported_media_type`, `not_implemented`, `service_unavailable`,
    `timeout`, `internal_error`.

    ## Implementation status
    Operations carry `x-status`. `available` means the endpoint is implemented and
    behaves as documented. `planned` means the route exists, is authorized and
    rate limited, and answers `501 not_implemented` until the feature task that
    owns it lands, so clients can be written against this contract today without
    guessing at the final shape.

    ## Conventions
    * JSON in, JSON out. Unknown request fields are rejected.
    * Request bodies are limited to 1 MiB unless stated otherwise.
    * Idempotency: `POST` creates, `PATCH` updates a subset, `DELETE` removes.
    * Lists are cursor paginated with a bounded page size (`limit`, `cursor`).
  contact:
    name: Unbored
    url: https://unboredapp.vercel.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://unboredapp.vercel.app/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local gateway

tags:
  - name: auth
    description: |
      The credential lifecycle on top of Supabase Auth. Supabase stores the
      credentials and issues the tokens; this group owns the application session.
      Credential and token bodies are limited to 8 KiB, and the endpoints that
      verify a password are throttled per client and per account.
  - name: users
    description: Player profiles.
  - name: games
    description: Game catalogue.
  - name: sessions
    description: Play sessions; the only path to a score.
  - name: scores
    description: Score records and personal bests.
  - name: leaderboards
    description: Global and friends boards.
  - name: feed
    description: The personalised game feed.
  - name: recommendations
    description: Suggested games.
  - name: social
    description: Comments, follows and likes.
  - name: notifications
    description: In-app and push notifications.
  - name: search
    description: Game, creator and player search.
  - name: moderation
    description: Reports and moderation actions.
  - name: analytics
    description: Product analytics.
  - name: admin
    description: Operations API behind the admin dashboard.
  - name: health
    description: Liveness of the gateway itself, for uptime checks and deployments.

security:
  - bearerAuth: []

paths:
  /:
    get:
      operationId: getApiVersion
      tags: [admin]
      summary: Report the API version
      security: []
      x-status: available
      responses:
        "200":
          description: Version discovery for clients and probes.
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, version]
                properties:
                  apiVersion: { type: string, const: v1 }
                  version: { type: string, example: 0.1.0 }
                  commit: { type: string, example: 9f2c1ab }

  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Report that the gateway is serving requests
      description: |
        Liveness of the deployed gateway itself, not of anything behind it: it
        verifies no token, opens no database connection and calls no upstream, so
        it answers `200` even while every backend service is unimplemented and
        answers `501`. Readiness — which does run dependency checks — is the
        unversioned `/readyz`, and orchestrators keep using `/healthz` and
        `/readyz`.
      security: []
      x-status: available
      responses:
        "200":
          description: The gateway is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, example: 0.1.0 }
        "503":
          description: The process is draining, so it must receive no new traffic.

  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      description: |
        Creates the account in Supabase Auth and returns the new session.

        This service stores no credential: the password is forwarded to Supabase,
        which applies the project's own password policy, sends the confirmation
        mail and creates the profile row through its `handle_new_user` trigger.

        `username` is the name the account will own. It is trimmed and
        lowercased, checked against the same format rule as the profile (3–24
        letters, digits, underscores) and checked for availability before the
        account is created; a taken name answers `409` with `field: username`.
        The trigger then persists it in the same transaction, so the choice
        survives email confirmation. Omitting the field is only for clients built
        before it existed: the database generates a name for them.

        When the project requires email confirmation no session exists until the
        address is confirmed, so that response carries `user` and no `tokens`.
      security: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, minLength: 3, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72 }
                username:
                  type: string
                  minLength: 3
                  maxLength: 24
                  pattern: "^[A-Za-z0-9_]{3,24}$"
                  description: |
                    The username to own. Uppercase is normalized to lowercase;
                    uniqueness is case-insensitive. Omit only for clients that
                    predate the field — the database then generates a name.
      responses:
        "201":
          description: |
            The account was created. `tokens` is present when Supabase issued a
            session, and omitted while email confirmation is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/username-available:
    get:
      operationId: usernameAvailable
      tags: [auth]
      summary: Check whether a username is unclaimed
      description: |
        Answers while the sign-up form is being filled in. Public and anonymous:
        the visitor does not have an account yet.

        The response carries the normalized username and a boolean — never a
        profile or any information about who currently holds the name. The read
        goes through the Data API under RLS, so no secret key is involved.

        A lookup that cannot be completed answers `503`; callers must treat that
        as unknown, never as available.
      security: []
      x-status: available
      parameters:
        - name: username
          in: query
          required: true
          description: The candidate username. Trimmed and lowercased before validation.
          schema:
            type: string
            minLength: 3
            maxLength: 24
            pattern: "^[A-Za-z0-9_]{3,24}$"
      responses:
        "200":
          description: The normalized username and whether it is available.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, available]
                properties:
                  username: { type: string }
                  available: { type: boolean }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with an email and password
      description: |
        Verifies the credential against Supabase Auth and returns the session.

        A wrong password and an unknown address answer identically, and the reason
        is never echoed: nothing here reveals whether an account exists.
      security: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, minLength: 3, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 72 }
      responses:
        "200":
          description: The credential matched, and the session is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is right but the address is not confirmed yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a refresh token for a new session
      description: |
        Rotates the Supabase session and returns both tokens again.

        The refresh token travels in the body of a `POST`, never in a query
        string, so it stays out of access logs and browser history. A token
        Supabase no longer recognises answers `401`, which the client should treat
        as "sign in again".
      security: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        "200":
          description: The session was rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/session:
    post:
      operationId: createSession
      tags: [auth]
      summary: Exchange a Supabase access token for the application session
      description: |
        Returns the application's view of a session — role, onboarding state,
        expiry — for a Supabase access token the caller already holds. That is how
        a client which just finished a Supabase-side flow (an emailed link, an
        OAuth redirect) asks for the session it does not hold yet.

        The token is verified exactly as on every other authenticated route: a
        JWKS-checked signature plus issuer, audience and expiry. It is the only
        auth route reachable without a bearer token, and it returns no token of
        its own.
      security: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessToken]
              properties:
                accessToken: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        "200":
          description: The session belonging to that token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: getSession
      tags: [auth]
      summary: Read the current session
      description: |
        Reports the session of the caller whose bearer token the shared auth
        middleware verified. The user id, role and email come from that token and
        are never parameters.
      x-status: available
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Revoke the current session
      description: |
        Revokes the presented Supabase session, so its refresh token can no longer
        mint an access token. The access token itself stays verifiable until it
        expires, so the client discards it too.

        Retrying is safe: revoking an already-revoked session is a success, which
        lets a client finish signing out after a dropped response.
      x-status: available
      responses:
        "204": { description: The session is revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Read the signed-in profile
      description: |
        The profile of the caller, resolved from the verified token. There is no
        parameter that addresses anyone else: the identity is never read from the
        body, a query value or a header. `role` comes from the same verified token
        `/auth/session` reports, so the two endpoints cannot disagree.
      x-status: available
      responses:
        "200":
          description: The profile of the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: |
            The account has no profile row. Every account gets one from the
            `handle_new_user` trigger, so this is a genuinely missing profile
            rather than an empty state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update the signed-in profile
      description: |
        Only presentation fields are writable: `role`, `is_suspended` and the
        timestamps are **rejected**, not ignored — the refusal names the field.
        The database enforces the same rule a second time: the UPDATE grant on
        `profiles` covers `username`, `display_name`, `bio`, `avatar_path` and
        `onboarded_at`, so a request that got past this service still could not
        write a role.

        Usernames are 3–24 lowercase letters, digits and underscores, unique
        case-insensitively. A name someone else holds is refused with
        `409 conflict` naming the field.

        Concurrency is opt-in. Send back the `updatedAt` you read and the write
        applies only if the row still holds that value; otherwise it is refused
        with `409 conflict` rather than overwriting a change you never saw.
        Omitting `expectedUpdatedAt` accepts last-write-wins, which is why a
        client that cares about concurrent edits should always send it.
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string, minLength: 1, maxLength: 60 }
                username:
                  type: string
                  minLength: 3
                  maxLength: 24
                  pattern: "^[a-z0-9_]{3,24}$"
                  description: |
                    3–24 lowercase letters, digits and underscores, unique
                    case-insensitively. Only sent when the name actually changed.
                bio:
                  type: [string, "null"]
                  maxLength: 300
                  description: A null clears the field; omitting it leaves it.
                avatarPath:
                  type: [string, "null"]
                  maxLength: 160
                  description: |
                    `"<account id>/<file name>"`, the object path inside the
                    caller's own storage prefix. A null (or an empty string)
                    clears it; omitting it leaves it.
                expectedUpdatedAt:
                  type: string
                  format: date-time
                  description: |
                    The `updatedAt` of the profile this edit is based on. Omit it
                    to accept last-write-wins.
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            The database refused the write: the caller tried to change a column
            the UPDATE grant excludes, or Row Level Security refused the row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The account has no profile row to update.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            Either the profile changed since the caller read it, so
            `expectedUpdatedAt` no longer matches — or the requested username is
            already taken. A taken name carries the field in the error details,
            so the two cases are told apart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /users/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getPublicProfile
      tags: [users]
      summary: Read a public profile
      security: []
      x-status: planned
      responses:
        "200":
          description: Public profile fields only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: Browse the catalogue
      description: |
        A page of published games, newest first. An unpublished game is never
        included: the endpoint reads through the database's RLS policies as an
        anonymous caller, so a draft, a game under review or a restricted game is
        absent from the result rather than filtered out here.

        Ordering is recency, which is the only order the catalogue offers. Play
        counts now exist, but a popularity ranking is not implemented, so `sort`
        accepts only `latest` instead of pretending one is.

        `plays` is a real measurement: the number of completed runs of that game,
        counted in the database from persisted sessions. A game nobody has
        finished reports `0`, which is a fact and not a missing value. No rating,
        like total, comment total or average session duration is returned — no
        service records those, and a fabricated number is indistinguishable from a
        real one on screen.
      security: []
      x-status: available
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: category
          in: query
          description: A category slug, as returned by `GET /categories`. A well-formed slug that names no category is an empty page, not an error.
          schema: { type: string, pattern: "^[a-z0-9-]{2,32}$" }
        - name: q
          in: query
          description: |
            Case-insensitive substring match over a game's title, tagline and
            description. The characters the filter grammar uses structurally
            (`,` `(` `)` `*` `"` `\`) are ignored rather than searched for.
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: |
            The only order the catalogue can compute from real data. Any other
            value is a `400`: ranking by popularity or trend needs play counts
            that do not exist yet.
          schema: { type: string, enum: [latest] }
      responses:
        "200":
          description: A page of published games.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createGame
      tags: [games]
      summary: Create a game
      description: The owner is taken from the token; a body field cannot set it.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameCreate" }
      responses:
        "201":
          description: The created game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /games/following:
    get:
      operationId: listFollowingFeed
      tags: [games]
      summary: Read the caller's Following feed
      description: |
        Published creator-owned games of the accounts the verified caller
        follows, newest first. The follower is taken from the verified access
        token; there is no user-id parameter. Official ownerless games are
        excluded by the database function, not by client filtering, and only
        published games the viewer may see are returned. Cursor pagination uses
        the same opaque keyset cursor as the catalogue. An empty follow list is
        an empty page, not an error; anonymous callers are refused with 401.
      x-status: available
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: |
            Case-insensitive substring match over a game's title, tagline and
            description, scoped to the feed.
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: A page of the caller's Following feed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /games/{slug}:
    parameters:
      - $ref: "#/components/parameters/GameSlug"
    get:
      operationId: getGame
      tags: [games]
      summary: Read a game
      description: |
        One published game, found by its slug — the same identifier the web app
        puts in its URLs (`/games/stack-10`), so a link stays stable across a
        redeploy.

        An unknown slug and an unpublished game answer the same `404`: telling
        them apart would let a stranger enumerate drafts.
      security: []
      x-status: available
      responses:
        "200":
          description: The published game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update an owned game
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameUpdate" }
      responses:
        "200":
          description: The updated game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /games/{slug}/leaderboard:
    parameters:
      - $ref: "#/components/parameters/GameSlug"
    get:
      operationId: getLeaderboard
      tags: [leaderboards]
      summary: Read a game's leaderboard
      description: |
        The persisted ranking for one published game: each player's best score,
        the first time they reached it, and how many scored runs they had in the
        window. It is derived entirely from verified scores — a board is not a
        separate record that could disagree with the runs behind it.

        Ties share a rank, so two players on 120 points are both first rather than
        one of them being arbitrarily second.

        Authentication is optional. The board is public; a caller who presents a
        token also gets their own standing as `me`, and `me` is `null` for an
        anonymous caller and for a signed-in one with no scored run in the window.
        A player with no score has no rank, and zero would read as "last place".

        A game that does not exist, or is not published, is a `404` — the same
        answer as reading it — rather than an empty board. A published game nobody
        has played is an empty board, which is a real answer.

        `scope=friends` is refused with a `400` that says why: a friends board
        needs a following graph, which does not exist yet. `scope=global` is the
        only scope that can be computed.
      security:
        - {}
        - bearerAuth: []
      x-status: available
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: offset
          in: query
          description: |
            How many ranked players to skip. A board is a ranking, so deep paging
            is bounded: an offset past 10000 is a `400` rather than a request that
            walks the whole board.
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: scope
          in: query
          description: |
            Only `global` can be computed. `friends` is a real, unimplemented
            scope and is refused with an explanation rather than being treated as a
            typo.
          schema: { type: string, enum: [global, friends], default: global }
        - name: period
          in: query
          description: |
            The window over the scores, by their recorded time: `all` (the
            default), the last 24 hours, or the last 7 days.
          schema: { type: string, enum: [all, day, week], default: all }
      responses:
        "200":
          description: One page of the board, plus the caller's own standing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaderboardBoard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /categories:
    get:
      operationId: listCategories
      tags: [games]
      summary: List categories with their real published-game counts
      description: |
        Every category, with the real number of published games in it. A category
        that holds nothing yet is present with a count of `0`, which is an answer:
        the category exists and is empty.

        The count comes from a database view that filters on `status =
        'published'` inside its own definition, so a draft never contributes — not
        even when the caller is the draft's owner.
      security: []
      x-status: available
      responses:
        "200":
          description: Every category, ordered by the catalogue's own sort order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sessions:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a play session
      description: |
        Issues one run of one game. The server owns the session id, the seed and
        the start time; the caller names the game, the rules it intends to play and
        what it is running on. A session is the precondition for submitting a
        score, and the only way to get one: clients have no write access to the
        session table at all.

        Only a published game with an implemented runtime can be started. An
        unpublished game, a playable-but-unimplemented one, and a slug that does
        not exist all answer the same `404`, so nothing can be probed by slug.

        Authentication is optional. A signed-in caller's run is eligible to become
        a ranked score; a guest's run is issued, played and verified exactly the
        same way, and is never recorded as a score — the caller's identity comes
        from their token and no body field can supply one.

        Starting a run also abandons the caller's previous open run of the same
        game, so a reload cannot leave two completable sessions behind.

        A daily game gets one ranked attempt per UTC day. When a signed-in caller
        has already completed a run of today's deck, the request answers `409`
        and issues nothing. Guests are not limited: their runs are verified and
        unranked, so repeated practice cannot put a score on a board.
      security:
        - {}
        - bearerAuth: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gameSlug, rulesVersion]
              properties:
                gameSlug: { type: string, pattern: "^[a-z0-9-]{2,48}$", example: stack-10 }
                rulesVersion:
                  type: string
                  pattern: "^[a-z0-9-]{2,32}@[0-9]{1,4}$"
                  example: stack-10@1
                  description: |
                    The rules the client will play. The server issues a session
                    pinned to a version it can verify, and refuses one it cannot.
                client: { type: string, maxLength: 40, example: web/1.0 }
      responses:
        "201":
          description: The open session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaySession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The signed-in caller has already completed today's daily run. The
            next run is issued at midnight UTC. This is a rule of the game, not a
            temporary failure; retrying the same request cannot succeed today.
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sessions/{sessionID}/complete:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeSession
      tags: [sessions]
      summary: Complete a play session and record the score
      description: |
        Submits a finished run for verification. **The score in the body is a
        claim, not a record**: the server replays `progress.actions` from the
        session's seed, derives the score itself, and records that. A claimed score
        the replay does not produce is refused (`422`, with the replayed score in
        the message rather than recorded).

        Where a game records its ending in the action list, the whole run must be
        submitted: a body that stops before the move which ended the run is
        refused, so a player cannot discard the move that lost. 7 Second is the
        exception in the other direction — its clock decides when a run ends, so
        a submission is valid with any number of answers from zero to sixty — and
        so is Queens, whose player may end a run at any time: a Queens run never
        loses points, so any prefix of a legal line is valid. Zip is the same,
        with one more check: its run is against a clock the server times from the
        session's start, and a run that arrives after the time its solved boards
        earned is refused (`422`).

        Retries are safe and expected. A repeated submission of the run already
        recorded answers `200` with `duplicate: true` and the recorded score, and a
        *different* run for a closed session is refused (`409`) rather than
        replacing the first.

        The session's rules version is the one it was issued under; a session
        pinned to rules the server does not implement is refused (`409`). A session
        that has expired (`409`) or was abandoned by a newer run (`409`) cannot be
        submitted at all.

        A daily game's ledger is guarded too: a second session of the same day's
        deck cannot become a second score. Its completion answers `409` and the
        first recorded run is the one that counts, so a start racing a completion
        cannot double a player's entry.
      security:
        - {}
        - bearerAuth: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score, durationMs, progress]
              properties:
                score:
                  type: integer
                  minimum: 0
                  description: The score the client believes it earned. Compared with the replay; never trusted.
                durationMs:
                  type: integer
                  minimum: 1
                  description: |
                    How long the run took, measured by the player's own clock. A
                    claim longer than the session has existed is refused.
                progress:
                  type: object
                  additionalProperties: false
                  required: [rulesVersion, actions]
                  properties:
                    rulesVersion: { type: string, pattern: "^[a-z0-9-]{2,32}@[0-9]{1,4}$" }
                    actions:
                      type: array
                      description: |
                        The run, as the ordered list of positions the run's moves
                        addressed: a column for Stack 10, a pad for Chain, a cell
                        for Memory Flash, a cell for One Move, a direction for
                        Color Merge, a cell for Don't Touch the Black, an
                        answer button for 7 Second, and a cell for Queens and
                        for Zip (the cells its path enters). This is what is replayed; the
                        rules for how a move is generated and what it does belong
                        to the game (see `docs/games`). The bound is a submission's
                        move ceiling, not a complete run: the finite games' lengths
                        are the moves they hold (sixty tiles for the retired Stack
                        10 deck, sixty cells for the retired Don't Touch the Black
                        deck, twenty-five for One Move, sixteen for Memory Flash,
                        forty-eight slides for the retired Color Merge deck), while
                        the endless games carry up to 4096 Stack 10 tiles, 4096
                        Chain taps, 4096 Color Merge slides, 4095 Don't Touch
                        the Black cell taps, 8192 Queens taps (notes are taps)
                        and 8192 Zip cells. A position is a column for Stack 10
                        (0–3), a pad for Chain, a cell for Memory Flash, One Move
                        and Don't Touch the Black, a direction for Color Merge
                        (0–3), an answer button for 7 Second (0–2) and a cell of
                        the 9×9 board for Queens (0–80) and of the 7×7 board for
                        Zip (0–48). Each
                        verifier refuses anything past its own bound.
                      maxItems: 8192
                      # The highest position any shipped version addresses: a cell
                      # on Don't Touch the Black's endless conveyor (0–4094).
                      items: { type: integer, minimum: 0, maximum: 4094 }
      responses:
        "200":
          description: The verified run. Identical to a retry's answer, except that a retry sets `duplicate`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

