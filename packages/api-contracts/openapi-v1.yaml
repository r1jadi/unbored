              properties:
                status: { type: string, enum: [review, published, rejected, archived] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The new state and the recorded action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModerationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: Categories with both real counts
      description: |
        Every category with the number of *published* games in it (what the
        catalogue shows) and the number that exist at all, which includes games
        the public count cannot see. Requires the moderator or administrator
        role.
      x-status: available
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The category list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin]
      summary: The moderation queue
      description: |
        Reports newest first, open ones before resolved ones, each with the
        reported game, comment or profile resolved to a title, an excerpt or a
        username. The queue is empty until a report is filed; it is never padded.
        Requires the moderator or administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, reviewing, resolved, dismissed] }
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/reports/{reportID}:
    patch:
      operationId: moderateReport
      tags: [admin]
      summary: Move a report through its workflow
      description: |
        Triages, resolves, dismisses or reopens a report. Resolving and
        dismissing require a reason, the resolver is stamped from the caller's
        token (never from the body), reopening clears the recorded resolution, and
        the decision is written to `moderation_actions` in the same transaction.
        Requires the moderator or administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ReportID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [open, reviewing, resolved, dismissed] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The new state and the recorded action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModerationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/comments:
    get:
      operationId: listAdminComments
      tags: [admin]
      summary: Comments, hidden ones included
      description: |
        The comment moderation list with its real like and report counts and its
        hidden state. Requires the moderator or administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [all, visible, hidden], default: all }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of comments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCommentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/comments/{commentID}:
    patch:
      operationId: moderateComment
      tags: [admin]
      summary: Hide or restore a comment
      description: |
        Sets `comments.is_hidden`, which has no UPDATE grant for the Data API at
        all, so this operation is the only path to it. Hiding requires a reason
        and is recorded in `moderation_actions` in the same transaction. Requires
        the moderator or administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CommentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hidden]
              properties:
                hidden: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The new state and the recorded action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModerationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: The account directory
      description: |
        Accounts with the two fields the Data API withholds from every other
        caller — the email address and the suspension flag — plus the role, the
        real activity counts and the number of reports filed against the account.
        Requires the moderator or administrator role; suspending an account does
        not (see the PATCH below).
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: role
          in: query
          schema: { type: string, enum: [user, moderator, admin] }
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/users/{userID}:
    patch:
      operationId: setAccountSuspension
      tags: [admin]
      summary: Suspend or restore an account
      description: |
        Sets `profiles.is_suspended`, which has no UPDATE grant for the Data API,
        so this operation is the only path to it. **Administrator only**: the
        route requires the administrator claim and the database re-checks
        `is_admin()`, and the caller cannot suspend their own account. A
        suspension requires a reason and is recorded in `moderation_actions`.
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [suspended]
              properties:
                suspended: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The new state and the recorded action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModerationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/leaderboards:
    get:
      operationId: listAdminScores
      tags: [admin]
      summary: Verified scores with the run behind each one
      description: |
        Every recorded score with the game, the player and the run it was
        verified against — evidence, not just a number. Requires the moderator or
        administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - name: game
          in: query
          schema: { type: string, pattern: "^[a-z0-9-]{2,48}$" }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of scores.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminScorePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/moderation-log:
    get:
      operationId: listModerationLog
      tags: [admin]
      summary: The audit trail of staff decisions
      description: |
        Every recorded moderation action, newest first, with the moderator who
        made it. Requires the moderator or administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModerationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/system/services:
    get:
      operationId: listSystemServices
      tags: [admin]
      summary: Which services the platform is made of
      description: |
        The platform's routing table: what exists, not what is healthy. This
        deployment collects no uptime or latency, so every entry reports
        `unmeasured` and the response says so — a fabricated percentage here would
        be indistinguishable from a measured one. Requires the moderator or
        administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The service list and what is not measured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSystemReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase access token. Verified against the project's JWKS (ES256/RS256)
        or, for legacy projects, the HS256 secret. `service_role` tokens are
        rejected on every user-facing route.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    GameID:
      name: gameID
      in: path
      required: true
      description: The game's uuid, which is internal — slugs are the public identifier.
      schema: { type: string, format: uuid }
    ReportID:
      name: reportID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentID:
      name: commentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Offset:
      name: offset
      in: query
      description: How many rows to skip. A ranking is not paged this way; a moderation list is.
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    AdminLimit:
      name: limit
      in: query
      description: The page size. The answer carries `hasMore` rather than a total.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    GameSlug:
      name: slug
      in: path
      required: true
      description: The game's stable public identifier, matching its web URL.
      schema: { type: string, pattern: "^[a-z0-9-]{2,48}$" }

  responses:
    BadRequest:
      description: The request was malformed or missing a required value.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, expired or invalid credentials.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not allowed to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource — or none the caller may know about.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Well-formed input that failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: The caller exceeded its budget.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: A dependency of this endpoint is not configured or not reachable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The request body is larger than the endpoint accepts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: The route exists and is authorized but is not implemented yet.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - unprocessable
                - rate_limited
                - payload_too_large
                - unsupported
                - not_implemented
                - unavailable
                - timeout
                - internal
            message: { type: string }
            request_id: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  rule: { type: string }
    Session:
      type: object
      required: [userId, role]
      description: |
        The application's view of a session, built from a verified token. It
        carries no token of its own: only what a screen needs to render.
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [user, moderator, admin] }
        email: { type: string, format: email }
        onboarded:
          type: boolean
          description: |
            Omitted when it could not be read. `false` means the caller has not
            finished onboarding, which is an answer; a failed read is not, and
            reporting one as the other would restart onboarding.
        expiresAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [session]
      description: What the credential and refresh endpoints return.
      properties:
        session: { $ref: "#/components/schemas/Session" }
        tokens: { $ref: "#/components/schemas/Tokens" }
        user: { $ref: "#/components/schemas/AuthUser" }
    Tokens:
      type: object
      required: [accessToken, refreshToken, tokenType]
      description: |
        The Supabase token pair, returned only to the caller that earned it, in a
        response marked `no-store`. The refresh token is a credential: a client
        keeps it out of anything a page could read back. Omitted while email
        confirmation is pending, when no session exists yet.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: bearer }
        expiresAt: { type: string, format: date-time }
        expiresIn:
          type: integer
          minimum: 0
          description: Lifetime of `accessToken` in seconds.
    AuthUser:
      type: object
      required: [id, email, emailConfirmed, createdAt]
      description: The Supabase user record, trimmed to what the app shows.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailConfirmed: { type: boolean }
        createdAt: { type: string, format: date-time }
    Profile:
      type: object
      required: [id, username, displayName, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, pattern: "^[a-z0-9_]{3,24}$" }
        displayName: { type: string }
        bio: { type: [string, "null"] }
        avatarPath: { type: [string, "null"] }
        role: { type: string, enum: [user, moderator, admin] }
        onboardedAt:
          type: [string, "null"]
          format: date-time
          description: Null until the user finishes onboarding.
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: >-
            Changes on every write. Send it back as `expectedUpdatedAt` to make
            a PATCH conditional on this exact version. The projection
            deliberately omits `is_suspended`: the SELECT grant excludes it, so
            no response can carry it.
    PublicProfile:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        bio: { type: [string, "null"] }
        avatarPath: { type: [string, "null"] }
        followers: { type: integer, minimum: 0 }
        following: { type: integer, minimum: 0 }
    Game:
      type: object
      required: [slug, title, playable, plays, isOfficial, updatedAt]
      description: |
        A published game as the catalogue exposes it.

        `plays` is a measurement: completed runs, counted by the database, where
        `0` means nobody has finished the game rather than "unknown".

        Deliberately absent: `id` (a slug is the public identifier and the uuid is
        internal), `ownerId` (there is no public profile endpoint to resolve it
        into a name), and the activity metrics no service records — likes,
        comments, saves, ratings, average session duration and any aggregate
        ranking. Shipping a plausible-looking zero for one of those would be
        indistinguishable from a real measurement.
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9-]{2,48}$"
          description: The stable public identifier, matching the web URL `/games/<slug>`.
        title: { type: string, maxLength: 80 }
        tagline: { type: [string, "null"] }
        description: { type: [string, "null"] }
        instructions:
          type: [string, "null"]
          description: How to play. Null while a game has no written rules.
        category:
          oneOf:
            - $ref: "#/components/schemas/CategoryRef"
            - type: "null"
          description: |
            Null when the game is not in a category. A reference to link and label
            by — the counts live on `Category`, which is what `/categories`
            returns.
        runtime:
          type: [string, "null"]
          description: |
            The client runtime that plays this game (`stack-10`, `chain`,
            `memory-flash`, `one-move`, `color-merge`, `dont-touch`,
            `seven-second`, `queens` or `zip`), or null when none exists. It is the runtime's
            identifier, not its title, because the client mounts a runtime by
            that name.
        playable:
          type: boolean
          description: |
            True only when `runtime` names a runtime that actually exists. A
            published but unplayable game is listed, not playable, and the UI must
            not offer to start it.
        plays:
          type: integer
          minimum: 0
          description: |
            Completed runs of this game, counted from persisted sessions. One play
            is one finished run: an opened tab is not a play, a guest's verified
            run is, and retrying a submission cannot add a second.
        isOfficial:
          type: boolean
          description: First-party Unbored content, as opposed to a creator's.
        coverPath:
          type: [string, "null"]
          description: |
            Storage object path (`<slug>/<file>`) inside the public `game-assets`
            bucket, not a URL. Null until real art is uploaded.
        publishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{2,32}$" }
        name: { type: string, maxLength: 40 }
    Category:
      type: object
      required: [slug, name, gameCount]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{2,32}$" }
        name: { type: string, maxLength: 40 }
        description: { type: [string, "null"] }
        gameCount:
          type: integer
          minimum: 0
          description: Published games in this category. Real, and counted in the database.
    GameList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Game" }
        nextCursor:
          type: [string, "null"]
          description: |
            Opaque cursor for the next page, or null on the last page. Pass it
            back as `cursor`; do not construct one.
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    GameCreate:
      type: object
      additionalProperties: false
      required: [slug, title]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{2,48}$" }
        title: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        categoryId: { type: string, format: uuid }
    GameUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        categoryId: { type: string, format: uuid }
    PlaySession:
      type: object
      required: [id, gameSlug, rulesVersion, seed, tileCount, startedAt, expiresAt, ranked]
      description: |
        An issued run. The id and the seed are the server's, and the seed is sent
        as a decimal string: it is a 64-bit integer, and a JSON number would round
        it in a client that parses it as a double.
      properties:
        id: { type: string, format: uuid }
        gameSlug: { type: string, pattern: "^[a-z0-9-]{2,48}$" }
        rulesVersion: { type: string, pattern: "^[a-z0-9-]{2,32}@[0-9]{1,4}$" }
        seed:
          type: string
          pattern: "^-?[0-9]{1,19}$"
          description: The run's seed, as a decimal string. The game's move sequence is a function of it.
        tileCount:
          type: integer
          minimum: 1
          description: "How many moves a run holds: tiles for Stack 10, taps for Memory Flash and One Move, slides for Color Merge, cell taps for Don't Touch the Black, answers for 7 Second, and cell taps for Queens. The endless games report their submission bound instead of a complete length, because they have none: 4096 tiles for Stack 10, 4096 taps for Chain, 4096 slides for Color Merge, 4095 cell taps for Don't Touch the Black and 8192 taps for Queens. The client does not choose it."
        startedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: When the run stops being completable. An abandoned tab must not leave an open run forever.
        ranked:
          type: boolean
          description: |
            Whether a score from this run can be ranked. False for a guest run:
            it is played and verified, and there is no user to attach a score to.
    RunResult:
      type: object
      required:
        [
          sessionId,
          gameSlug,
          score,
          clearedColumns,
          tilesPlaced,
          durationMs,
          ranked,
          recordedAt,
          duplicate,
        ]
      description: |
        A verified run. `score` is the server's own arithmetic from replaying the
        submitted actions — not the number the client sent, which was compared with
        it and refused on any disagreement.
      properties:
        sessionId: { type: string, format: uuid }
        gameSlug: { type: string, pattern: "^[a-z0-9-]{2,48}$" }
        score: { type: integer, minimum: 0 }
        clearedColumns: { type: integer, minimum: 0 }
        tilesPlaced: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 1 }
        ranked:
          type: boolean
          description: "False for a guest run, which is verified and recorded on the session alone."
        recordedAt: { type: string, format: date-time }
        personalBest:
          type: [integer, "null"]
          minimum: 0
          description: The player's best score for this game after this run. Null for an unranked run.
        rank:
          type: [integer, "null"]
          minimum: 1
          description: The player's place on the all-time board after this run. Null for an unranked run.
        duplicate:
          type: boolean
          description: True when this submission was a retry of the run already recorded, which is safe and scored nothing twice.
    Score:
      type: object
      required: [id, gameId, userId, score, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        score: { type: integer, minimum: 0 }
        durationMs: { type: [integer, "null"], minimum: 1 }
        createdAt: { type: string, format: date-time }
    LeaderboardBoard:
      type: object
      required: [gameSlug, scope, period, entries, hasMore, me]
      description: |
        One game's ranking, as `GET /games/{slug}/leaderboard` returns it.
      properties:
        gameSlug: { type: string, pattern: "^[a-z0-9-]{2,48}$" }
        scope: { type: string, enum: [global] }
        period: { type: string, enum: [all, day, week] }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
        hasMore:
          type: boolean
          description: True when a further page exists. The server reads one row past the page rather than counting the board.
        me:
          oneOf:
            - $ref: "#/components/schemas/BoardStanding"
            - type: "null"
          description: |
            The caller's own standing, or null when they are anonymous or have no
            scored run in the window. A player with no score has no rank; zero
            would read as last place.
    LeaderboardEntry:
      type: object
      required: [rank, username, score, achievedAt, plays]
      description: |
        One ranked player's best score in the window. There is no user id: a
        username is how a person is addressed everywhere else in this API, and a
        caller's own row comes back separately as `me` rather than by matching an
        id on the client.
      properties:
        rank:
          type: integer
          minimum: 1
          description: Ties share a rank, so two players on the same score are both first.
        username:
          type: string
          description: |
            Empty when the profile row behind the score is gone. The score is still
            real, so it keeps its place instead of shifting everybody else up.
        score: { type: integer, minimum: 0 }
        achievedAt:
          type: [string, "null"]
          format: date-time
          description: When the player first reached this score.
        plays:
          type: integer
          minimum: 0
          description: How many scored runs the player had in this window.
    BoardStanding:
      type: object
      required: [rank, score, achievedAt, plays]
      properties:
        rank: { type: integer, minimum: 1 }
        score: { type: integer, minimum: 0 }
        achievedAt: { type: [string, "null"], format: date-time }
        plays: { type: integer, minimum: 0 }
    Leaderboard:
      type: object
      required: [id, gameId, scope]
      description: A board a client can discover from `GET /leaderboards`. The ranking itself is read per game.
      properties:
        id: { type: string }
        gameId: { type: string, format: uuid }
        scope: { type: string, enum: [global, friends, daily] }
        updatedAt: { type: string, format: date-time }
    Comment:
      type: object
      required: [id, gameId, authorId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
    Notification:
      type: object
      required: [id, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [follow, comment, like, score, moderation, system] }
        payload: { type: object, additionalProperties: true }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    Report:
      type: object
      required: [id, targetKind, targetId, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        targetKind: { type: string, enum: [game, comment, profile] }
        targetId: { type: string, format: uuid }
        reason: { type: string }
        details: { type: [string, "null"] }
        status: { type: string, enum: [open, reviewing, resolved, dismissed] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }

    # ── Admin ──────────────────────────────────────────────────────────────
    #
    # The admin views are separate schemas from the public ones on purpose: a
    # moderation row carries a state a visitor must never see (a draft's status, a
    # hidden comment, an account's email), so reusing `Profile` or `Game` here
    # would let a field added to the public view leak into the admin one.

    AdminSession:
      type: object
      required: [userId, username, displayName, role, isStaff, isAdmin, isSuspended]
      description: What the database says the caller is, for the caller alone.
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [user, moderator, admin] }
        isStaff:
          {
            type: boolean,
            description: "The moderator or administrator role, read from `public.user_roles`.",
          }
        isAdmin: { type: boolean }
        isSuspended: { type: boolean }

    AdminSeriesPoint:
      type: object
      required: [day, runs, scores, signups, players]
      description: |
        One day of real activity. A quiet day is present with zeros — an absent
        day would read as missing data, and it is not missing, it is zero.
      properties:
        day: { type: string, example: "2026-10-13" }
        runs: { type: integer, description: Completed runs that day. }
        scores: { type: integer, description: Ranked scores recorded that day. }
        signups: { type: integer }
        players: { type: integer, description: Distinct accounts that started a run that day. }

    AdminActivity:
      type: object
      required: [kind, at, actor, action, subjectKind, subject]
      description: One line of the dashboard feed, built from a row that exists.
      properties:
        kind: { type: string, enum: [moderation, game, score] }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        subjectKind: { type: string }
        subject: { type: string }
        href: { type: [string, "null"], description: A public path when the subject has one. }

    AdminTopGame:
      type: object
      required: [slug, title, runs]
      properties:
        slug: { type: string }
        title: { type: string }
        runs: { type: integer }

    AdminOverview:
      type: object
      required:
        [totalUsers, activeUsers, games, gamesPlayed, openReports, series, activity, topGames]
      properties:
        totalUsers: { type: integer }
        activeUsers:
          { type: integer, description: Distinct accounts that started a run in the last 24 hours. }
        games: { type: integer }
        publishedGames: { type: integer }
        playableGames: { type: integer }
        gamesPlayed:
          {
            type: integer,
            description: "Completed runs, which is what this platform means by a play.",
          }
        runsOpen: { type: integer, description: Runs in progress that have not expired. }
        scoresRecorded: { type: integer }
        players: { type: integer, description: Distinct accounts with a recorded score. }
        openReports: { type: integer }
        pendingReview: { type: integer, description: Games submitted and waiting for a decision. }
        reviewingReports: { type: integer }
        comments: { type: integer }
        hiddenComments: { type: integer }
        newUsersToday: { type: integer }
        avgRunSeconds:
          {
            type: [number, "null"],
            description: Null until a run has been completed — an unmeasured average is not zero.,
          }
        runsMeasured: { type: integer, description: How many runs the average covers. }
        series: { type: array, items: { $ref: "#/components/schemas/AdminSeriesPoint" } }
        activity: { type: array, items: { $ref: "#/components/schemas/AdminActivity" } }
        topGames: { type: array, items: { $ref: "#/components/schemas/AdminTopGame" } }

    AdminAnalyticsGame:
      type: object
      required: [slug, title, runs, players, bestScore]
      properties:
        slug: { type: string }
        title: { type: string }
        runs: { type: integer }
        players: { type: integer }
        bestScore: { type: integer }

    AdminTopPlayer:
      type: object
      required: [username, bestScore, scores]
      properties:
        username: { type: string }
        bestScore: { type: integer }
        scores: { type: integer }
        lastScoredAt: { type: [string, "null"], format: date-time }

    AdminAnalytics:
      type: object
      required: [days, totalUsers, runs, players, series, topGames, topPlayers]
      properties:
        days: { type: integer }
        totalUsers: { type: integer }
        newUsers: { type: integer, description: Accounts created inside the window. }
        runs: { type: integer }
        players: { type: integer }
        scores: { type: integer }
        comments: { type: integer }
        avgRunSeconds: { type: [number, "null"] }
        series: { type: array, items: { $ref: "#/components/schemas/AdminSeriesPoint" } }
        topGames: { type: array, items: { $ref: "#/components/schemas/AdminAnalyticsGame" } }
        topPlayers: { type: array, items: { $ref: "#/components/schemas/AdminTopPlayer" } }

    AdminGame:
      type: object
      required:
        [
          id,
          slug,
          title,
          status,
          isOfficial,
          playable,
          plays,
          players,
          comments,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        tagline: { type: [string, "null"] }
        status: { type: string, enum: [draft, review, published, rejected, archived] }
        isOfficial: { type: boolean }
        playable: { type: boolean }
        runtime: { type: [string, "null"] }
        categorySlug: { type: [string, "null"] }
        categoryName: { type: [string, "null"] }
        ownerUsername:
          {
            type: [string, "null"],
            description: "Null for a first-party game, which has no owning account.",
          }
        plays: { type: integer, description: Completed runs. }
        players: { type: integer, description: Distinct accounts that completed a run. }
        bestScore:
          { type: [integer, "null"], description: Null when the game has no verified score yet. }
        comments: { type: integer, description: "Comments written, hidden ones included." }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminGamePage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminGame" } }
        hasMore:
          {
            type: boolean,
            description: True when a further page exists. The service reads one row more than the page rather than counting the table.,
          }

    AdminUser:
      type: object
      required: [id, username, displayName, role, isSuspended, createdAt, plays, reportsAgainst]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email:
          {
            type: [string, "null"],
            description: Readable only through this endpoint; the Data API withholds it from every other caller.,
          }
        role: { type: string, enum: [user, moderator, admin] }
        isSuspended: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastActiveAt:
          {
            type: [string, "null"],
            format: date-time,
            description: When the account last started a run. Null when it never has.,
          }
        plays: { type: integer }
        bestScore: { type: [integer, "null"] }
        reportsAgainst:
          { type: integer, description: "Reports filed about this account, by anyone." }

    AdminUserPage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        hasMore: { type: boolean }

    AdminReport:
      type: object
      required: [id, status, targetKind, targetId, reason, reporterUsername, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [open, reviewing, resolved, dismissed] }
        targetKind: { type: string, enum: [game, comment, profile] }
        targetId: { type: string, format: uuid }
        targetLabel:
          {
            type: [string, "null"],
            description: "The reported game's title, the reported comment's author or the reported account's username.",
          }
        targetDetail:
          {
            type: [string, "null"],
            description: "A slug, a display name or an excerpt of the reported comment.",
          }
        reason: { type: string }
        details: { type: [string, "null"] }
        reporterUsername: { type: string }
        resolvedByUsername: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }

    AdminReportPage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminReport" } }
        hasMore: { type: boolean }

    AdminComment:
      type: object
      required:
        [
          id,
          body,
          authorUsername,
          gameSlug,
          gameTitle,
          isHidden,
          isReply,
          likes,
          reports,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        authorUsername: { type: string }
        gameSlug: { type: string }
        gameTitle: { type: string }
        isHidden: { type: boolean, description: Hidden comments are visible here and nowhere else. }
        isReply: { type: boolean }
        likes: { type: integer, description: "Real likes, counted from `public.likes`." }
        reports: { type: integer, description: Real reports filed about this comment. }
        createdAt: { type: string, format: date-time }

    AdminCommentPage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminComment" } }
        hasMore: { type: boolean }

    AdminScore:
      type: object
      required: [id, gameSlug, gameTitle, username, score, createdAt]
      description: A verified score with the run it was verified against.
      properties:
        id: { type: string, format: uuid }
        gameSlug: { type: string }
        gameTitle: { type: string }
        username: { type: string }
        score: { type: integer }
        sessionStartedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    AdminScorePage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminScore" } }
        hasMore: { type: boolean }

    AdminCategory:
      type: object
      required: [slug, name, sortOrder, publishedGames, totalGames]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        sortOrder: { type: integer }
        publishedGames: { type: integer, description: What the public catalogue counts. }
        totalGames:
          { type: integer, description: "Published, drafts, rejected and archived together." }

    AdminCategoryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminCategory" } }

    AdminModerationEntry:
      type: object
      required: [id, moderatorUsername, targetKind, targetId, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        moderatorUsername: { type: string }
        targetKind: { type: string, enum: [game, comment, profile] }
        targetId: { type: string, format: uuid }
        action:
          {
            type: string,
            description: "One of publish_game, reject_game, archive_game, review_game, resolve_report, dismiss_report, review_report, reopen_report, hide_comment, unhide_comment, suspend_account, restore_account.",
          }
        reason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    AdminModerationPage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminModerationEntry" } }
        hasMore: { type: boolean }

    AdminModerationResult:
      type: object
      required: [id, action]
      description: What a moderation write changed, and the action recorded for it.
      properties:
        id: { type: string, format: uuid }
        previousStatus: { type: [string, "null"] }
        status: { type: [string, "null"] }
        hidden: { type: [boolean, "null"] }
        suspended: { type: [boolean, "null"] }
        action: { type: string }

    AdminServiceStatus:
      type: object
      required: [name, status, note]
      properties:
        name: { type: string }
        status:
          {
            type: string,
            enum: [unmeasured],
            description: "This deployment measures no service health, and does not pretend to.",
          }
        note: { type: string }

    AdminSystemReport:
      type: object
      required: [measured, note, items]
      properties:
        measured: { type: boolean, enum: [false] }
        note: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/AdminServiceStatus" } }
