  /admin/games/{gameID}:
    patch:
      operationId: moderateGame
      tags: [admin]
      summary: Decide a game's status
      description: |
        Publishes, rejects, archives or returns a game to review. Only the
        transitions the platform defines are allowed, rejecting or archiving
        requires a reason, and the decision is recorded in `moderation_actions`
        in the same transaction, attributed to the caller's token. Requires the
        moderator or administrator role.
      x-status: available
