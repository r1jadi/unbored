  # The admin surface. Every operation requires a verified token. Administrator
  # access comes from the server-side ADMIN_EMAILS allowlist matched against
  # the verified token email (a token claim or a database row alone grants
  # nothing); moderator access additionally comes from the caller's own
  # `public.user_roles` row. The role named in each description is what the
  # service requires; a database refusal of an authorized caller is answered
  # `503`, never as success.
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Read the caller's own role and account state
      description: |
        Answers what the caller is: administrator for a verified token email in
        the server-side allowlist, else moderator or user from the caller's own
        `public.user_roles` row — plus their username and whether the account
        is suspended.
        This is the one admin route an ordinary signed-in account may call — the
        dashboard needs it to decide what to show, and an account that is not
        staff must be able to learn that. It exposes the caller's own row and
        nothing else, and the role it reports is never taken from the request.
      x-status: available
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's own identity and role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Platform numbers and recent activity
      description: |
        Counts and a fourteen-day series, every one of them measured from
        persisted rows. A value that cannot be computed is `null` rather than
        zero: `avgRunSeconds` is null until a run has actually been completed.
        The activity feed contains moderation decisions, published games and
        verified scores, and nothing else — there is no line in it that does not
        correspond to a row. Requires the moderator or administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The dashboard aggregate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Real activity aggregates over a window
      description: |
        Signups, players, completed runs, verified scores and the games and
        players with the most real activity. Requires the moderator or
        administrator role.
      x-status: available
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 90, default: 28 }
      responses:
        "200":
          description: The activity aggregate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalytics" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/games:
    get:
      operationId: listAdminGames
      tags: [admin]
      summary: Every game, published or not
      description: |
        The moderation list: drafts, submissions in review, rejected and archived
