# Render Blueprint for the API (free plan). The website itself is served by
# Cloudflare Workers; see docs/deployment/production.md.
#
# Frankfurt sits next to the Supabase database (eu-west-1, Ireland); a US region
# adds a transatlantic round trip to every query. The site reaches the API at
# api.unbored.lol (a DNS-only CNAME in Cloudflare), so moving it again only
# changes DNS, not the website build.
services:
  - type: web
    name: unbored-api-eu
    region: frankfurt
    runtime: docker
    plan: free
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - services/**
        - packages/go/**
        - infrastructure/docker/api.Dockerfile
    domains:
      - api.unbored.lol
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://unbored.lol,https://www.unbored.lol
      - key: PUBLIC_SITE_URL
        value: https://unbored.lol
      - key: SUPABASE_URL
        value: https://trrwaftksifjaiaxfmiu.supabase.co
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: EMAIL_FROM
        value: Unbored <hello@unbored.lol>
      - key: RATE_LIMIT_ENABLED
        value: "1"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "600"
      - key: RATE_LIMIT_BURST
        value: "60"
      - key: AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "10"
      - key: AUTH_RATE_LIMIT_BURST
        value: "5"
      # Where the real client address is (anonymous rate-limit buckets).
      # Render sits behind Cloudflare, which sets CF-Connecting-IP to the real
      # client and rejects requests that try to send it. X-Forwarded-For is not
      # safe here: Render keeps whatever the client put in it. Measured
      # 2026-11-14 with /debug/client-ip; see docs/deployment/production.md.
      - key: CLIENT_IP_SOURCE
        value: header:CF-Connecting-IP
      # Set CLIENT_IP_DEBUG to "1" to serve /debug/client-ip again if Render's
      # proxies change.
      - key: CLIENT_IP_DEBUG
        value: "0"
      # Filled in on the Render dashboard (sync: false = asked for at setup, never committed).
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
