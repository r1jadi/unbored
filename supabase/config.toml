# Supabase CLI configuration for the Unbored project.
#
# This file configures *local development* (`supabase start`). Hosted projects
# are configured in the Supabase dashboard and through environment variables —
# see docs/development/environments.md. Never put a secret in this file.
#
# The linked project id is intentionally not committed; run `supabase link` with
# the project ref from the dashboard.

project_id = "unbored-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
# Bound every Data API response so a runaway query cannot stream the table.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# 17, not 16: the CLI validates this against the Postgres majors its local stack
# ships (13/14/15/17 — 16 is skipped) and rejects 16 outright, both locally and
# in the Supabase Preview check. 16 is still the version the migrations and the
# RLS suite are written and tested against: .github/workflows/database.yml and
# scripts/test-rls.sh pin it.
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Mirrors the smallest bucket limit; per-bucket limits live in the migration.
file_size_limit = "50MiB"

[auth]
enabled = true
# The web app dev server. Add real origins here when a preview domain is used.
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081", "https://unbored.lol"]
jwt_expiry = 3600
enable_signup = true
# Minimum length, not composition rules: length beats character classes.
minimum_password_length = 10
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# Rate limits are part of the security baseline, not a tuning detail.
[auth.rate_limit]
email_sent = 20
sms_sent = 10
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[analytics]
enabled = false

[edge_runtime]
enabled = false

# No [functions] section on purpose: this project ships no Edge Functions,
# and every entry there would have to be a named function table.
