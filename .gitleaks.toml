# gitleaks configuration for Unbored.
#
# The stock ruleset is kept and only extended, never replaced. The allowlist
# entries below cover unit-test fixtures that are shaped like credentials but
# are not; they are in git history, so they cannot be silenced in the source
# files themselves.
#
# Real credentials must never be committed — see docs/development/environments.md.
# Anything added here must be a placeholder, never an actual key: this file is
# checked in and would itself become the leak.

[extend]
useDefault = true

[[allowlists]]
description = "Fake caller token in the Supabase auth client test, not a credential"
# Scoped to the literal placeholder rather than to the whole file, so a genuine
# secret committed to that test still fails the scan.
regexTarget = "match"
regexes = ['''the-callers-token''']

[[allowlists]]
description = "Fake JWT subject in the follows test, not a credential"
# generic-api-key fires on the `tokenSubject` fixture in
# src/lib/social/follows.test.tsx because the variable is named for what it
# carries and the value is a high-entropy uuid. Nothing is signed, stored or
# transmitted: the test assembles the token with btoa() and hands it to a
# mocked fetch. Scoped to this literal as it appears in the finding — never to
# the file — so a real key committed to the same test still fails the scan.
regexTarget = "match"
regexes = ['''5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a''']

[[allowlists]]
description = "Supabase session captured during QA, deleted in the next commit — the token must be revoked"
# Not a fixture: this is the only entry here that covers something that really
# was a credential. Commit afc8293 committed two files written by a manual QA
# run — a captured access token (.qa-logs/access) and the stored session that
# carried it (.qa-logs/session.json, which also held the refresh token). Both
# files are removed and .qa-logs/ is ignored now, but a deleted file is still a
# leaked secret: history keeps it, and rewriting published history is not an
# option for this repository.
#
# The scope is one commit, not one path: paths would blind the scanner to those
# names forever, while a commit is immutable — the findings it can hide are exactly
# the two that exist in it, and nothing committed later can hide behind it. A new
# secret in .qa-logs, or anywhere else, still fails the scan.
#
# REQUIRED FOLLOW-UP: revoke the session that token belonged to. Until it is
# revoked, this entry hides a live credential rather than a spent one. Revoke
# from Supabase → Authentication → Sessions ("sign out all users"), or with the
# service role key: POST /auth/v1/admin/users/<id>/logout?scope=global.
commits = ["afc8293f4dade8538ca9b1533901008801b6e583"]

[[allowlists]]
description = "Model name beside a fake key in the Deep Cut judge test, not a credential"
# generic-api-key fires on `New("test-key", "llama-3.3-70b-versatile")` in
# services/game-sessions/internal/deepcutjudge/judge_test.go: a high-entropy
# literal right after an argument named for a key. The key is the placeholder
# "test-key" and the other value is a public Groq model name; the call goes to a
# local httptest server. Checked by hand: that commit holds no real Groq key and
# not the Deep Cut judge key. The line was rewritten in the next commit (the name
# is now a constant), so nothing later depends on this entry.
#
# Scoped to the one commit, as above: a commit is immutable, so this can hide
# only the finding that exists in it, never a secret committed later.
commits = ["277fbc63a7bb1de88e6ff23bcccad0db519d8ea0"]
