name: web

# The web app lives at the repository root (TanStack Start + Vite). It keeps
# that position until the migration to apps/web described in
# docs/decisions/0002-web-app-location.md.
#
# Every job is read-only with respect to the repository; the deploy itself is
# Vercel's job and is not triggered from here.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/security/verifier_vectors.sql"
      - "public/**"
      - "scripts/generate-sitemap.mjs"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/security/verifier_vectors.sql"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      # bun.lock is the source of truth; a frozen install fails loudly when
      # package.json and the lockfile disagree instead of silently resolving.
      - name: Install dependencies
        run: bun install --frozen-lockfile --no-save

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Sitemap is up to date
        run: bun run sitemap:check

      - name: Production build
        run: bun run build

      - name: Audit dependencies
        # Fails the job on a high or critical advisory in the production tree.
        # Advisories that live in a transitive dependency, where no range in
        # package.json can reach the patched release, are pinned by the
        # "overrides" block in package.json instead of being ignored here.
        run: bun audit --audit-level=high
        continue-on-error: false
