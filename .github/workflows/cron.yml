# Daily jobs for hosts without a built-in scheduler (Vercel runs these from
# vercel.json's "crons"). Needs two repository secrets:
#   API_ORIGIN   e.g. https://unbored-api.onrender.com  (no trailing slash)
#   CRON_SECRET  the same value the API has
# Without API_ORIGIN the jobs skip, so a Vercel deployment is not double-run.
name: cron

on:
  schedule:
    - cron: "0 9 * * *" # game digests
    - cron: "0 10 * * *" # feedback emails
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [game-digests, feedback-emails]

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_ORIGIN: ${{ secrets.API_ORIGIN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the cron route
        if: env.API_ORIGIN != ''
        run: |
          job="${{ github.event.inputs.job }}"
          if [ -z "$job" ]; then
            if [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then job=game-digests; else job=feedback-emails; fi
          fi
          # Wake a sleeping free instance first; the first request can take ~1 minute.
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$API_ORIGIN/healthz"
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$API_ORIGIN/api/v1/cron/$job"
